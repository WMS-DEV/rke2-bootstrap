- name: Prepare all nodes
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags:
    - preflight
    - host_prep
    - bootstrap
    - always
  roles:
    - rke2-common

- name: Initialize first master and gather bootstrap artifacts
  hosts: kube-masters[0]
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags:
    - master_init
    - bootstrap_artifacts
    - control_plane
    - bootstrap
  roles:
    - role: rke2-master
      tasks_from: init
    - bootstrap-artifacts

- name: Join additional master nodes
  hosts: kube-masters[1:]
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tags:
    - master_join
    - control_plane
    - bootstrap
  roles:
    - rke2-master

- name: Join worker nodes
  hosts: kube-workers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags:
    - workers
    - bootstrap
  roles:
    - rke2-worker

- name: Bootstrap ArgoCD
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tags:
    - argocd
    - bootstrap
  roles:
    - argocd

- name: ArgoCD cutover
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tags:
    - argocd_cutover
  roles:
    - role: argocd
      tasks_from: cutover
